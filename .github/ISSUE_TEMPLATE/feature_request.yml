name: Feature request
description: Suggest something the mod could do for multi-repo work
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing when you work across many repos today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you'd like the mod to help. Mock-ups and examples welcome.
    validations:
      required: true
