---
name: Release
on:
  release:
    types: published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # plugin.json is bumped in a pull request before the release, so main
      # never needs a push from CI and can stay fully protected.
      - name: Check the tag matches plugin.json
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version. Bump it with 'make version VERSION=x.y.z' in a pull request first."
            exit 1
          fi

      - name: Run checks and tests
        run: |
          make deps
          make check
          make test

      - name: Attach the packaged plugin to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$(make --silent package)" --clobber
