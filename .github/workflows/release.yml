---
name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # plugin.json is bumped in a pull request before the release, so main
      # never needs a push from CI and can stay fully protected.
      - name: Find the draft release for plugin.json's version
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" != "true" ]; then
            echo "::error::No draft release for $tag. Bump the version with 'make version VERSION=x.y.z' in a pull request, merge it, and let Release Drafter draft $tag."
            exit 1
          fi

      - name: Run checks and tests
        run: |
          make deps
          make check
          make test
          make smoke

      # Releases are immutable once published, so the file goes on while the
      # release is still a draft, and publishing comes last.
      - name: Attach the packaged plugin to the draft
        run: gh release upload "$TAG" "$(make --silent package)" --clobber

      - name: Publish the release at the commit that was tested
        run: gh release edit "$TAG" --draft=false --target "$GITHUB_SHA"
