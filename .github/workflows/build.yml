---
name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run checks and tests
        run: |
          make deps
          make check
          make test

      - name: Scan real git repos
        run: make smoke

      - name: Package
        run: make package

  release:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      # A merged version bump in plugin.json is a release. Any other push to
      # main finds its version already tagged and does nothing, so no draft
      # sits waiting to be published by hand.
      - name: Read the plugin's version
        id: plugin
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft the release notes
        if: steps.plugin.outputs.is_new == 'true'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ steps.plugin.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases are immutable once published, so the package goes on while
      # the release is a draft, and publishing comes last, at the tested commit.
      - name: Publish the release
        if: steps.plugin.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.plugin.outputs.version }}"
          gh release upload "$tag" "$(make --silent package)" --clobber
          gh release edit "$tag" --draft=false --target "$GITHUB_SHA"
