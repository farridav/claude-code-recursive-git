---
name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run checks and tests
        run: |
          make deps
          make check
          make test

      - name: Scan real git repos
        run: make smoke

      - name: Package
        run: make package

  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      # The draft's version is plugin.json's, so the tag it publishes always
      # matches the version people install; labels sort the changelog.
      - name: Read the plugin's version
        id: plugin
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          disable-autolabeler: true
          version: ${{ steps.plugin.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
