# The repository's labels, synced by .github/workflows/labels.yml when this
# file changes on main. Release Drafter files merged pull requests under
# the changelog headings by these labels (.github/release-drafter.yml).

# Changelog: 🚀 Features
- name: feature
  color: "0e8a16"
  description: A new capability
- name: enhancement
  color: "a2eeef"
  description: An improvement to something that exists

# Changelog: 🐛 Bug Fixes
- name: fix
  color: "d73a4a"
  description: Fixes a bug
- name: bugfix
  color: "d73a4a"
  description: Fixes a bug (alias of fix)
- name: bug
  color: "d73a4a"
  description: Something isn't working

# Changelog: 🧰 Maintenance
- name: chore
  color: "c5def5"
  description: Upkeep, CI, tooling or refactoring
- name: dependencies
  color: "0366d6"
  description: Updates a dependency
- name: documentation
  color: "0075ca"
  description: Documentation only

# Size of the change, for the release notes
- name: major
  color: "b60205"
  description: Breaking change
- name: minor
  color: "fbca04"
  description: Backwards-compatible new behaviour
- name: patch
  color: "c2e0c6"
  description: Backwards-compatible fix or upkeep

# Triage
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: question
  color: "d876e3"
  description: Further information is requested
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: github_actions
  color: "000000"
  description: Updates a GitHub Actions workflow (Dependabot)
